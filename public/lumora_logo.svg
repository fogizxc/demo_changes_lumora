<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- LUMORA Brand Wordmark with signature red accent arc on the 'O' -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="3" fill="currentColor">
    <!-- Letters L U M -->
    <text x="10" y="46">LUM</text>
    
    <!-- Letter O with distinctive top-right red arc -->
    <g transform="translate(150, 32)">
      <!-- Base segment (white / currentColor) from ~3:30 through bottom and left up to 12 o'clock -->
      <path
        d="M 14.8 7.5 A 16.5 16.5 0 1 1 0 -16.5 L 0 -10.5 A 10.5 10.5 0 1 0 9.4 4.8 Z"
        fill="currentColor"
      />
      <!-- Distinctive red accent arc from 12 o'clock to ~3:30 -->
      <path
        d="M 0 -16.5 A 16.5 16.5 0 0 1 14.8 7.5 L 9.4 4.8 A 10.5 10.5 0 0 0 0 -10.5 Z"
        fill="#E52535"
      />
    </g>

    <!-- Letters R A -->
    <text x="176" y="46">RA</text>
  </g>

  <!-- Tagline underneath -->
  <text
    x="160"
    y="68"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="9"
    font-weight="700"
    letter-spacing="3"
    fill="currentColor"
    opacity="0.8"
  >
    ONE SYSTEM. MORE POSSIBILITIES.
  </text>
</svg>
